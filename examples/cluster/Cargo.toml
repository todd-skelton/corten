[package]
name = "cluster"
version = "0.1.0"
edition = "2021"
publish = false
description = "A seller-listings feed served by several instances with corten-cluster, plus the failover benchmark."

[dependencies]
corten = { path = "../../crates/corten", features = ["feed"] }
corten-cluster = { path = "../../crates/corten-cluster" }
async-nats = "0.50"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
