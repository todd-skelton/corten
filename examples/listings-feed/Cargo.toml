[package]
name = "listings-feed"
version = "0.1.0"
edition = "2024"
publish = false
description = "A seller's listings as one feed served by several instances with corten-cluster, a page that follows it, and the failover benchmark."

[dependencies]
corten = { path = "../../crates/corten", features = ["feed", "types"] }
corten-cluster = { path = "../../crates/corten-cluster" }
async-nats = "0.50"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
