# Load balancer for the failover benchmark: round-robin over instances a and b, SSE-friendly.
# Fixed IPs (see run.mjs), so a restarted instance comes back at the same address.
worker_processes 2;
events {
  worker_connections 8192;
}
http {
  access_log off;
  upstream feeds {
    server 10.77.77.21:8080 max_fails=1 fail_timeout=2s;
    server 10.77.77.22:8080 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://feeds;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_connect_timeout 1s;
      # GETs (snapshots, streams) move to the other instance; a POST already sent is not retried.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
