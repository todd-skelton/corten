{%- let f = AlertInput::FIELDS -%}
<div class="alert-form" id="alert-form">
      <form method="post" action="/items/{{ form.id }}" data-patch>
        <input type="hidden" name="{{ f.title }}" value="{{ form.title }}">
        <label>{{ t.t("alert.email") }}<input type="email" name="{{ f.email }}" value="{{ form.email }}" required{{ form.errors.aria(f.email)|safe }}></label>
        {%- if let Some(message) = form.errors.get(f.email) %}<p class="field-error" id="{{ f.email }}-error">{{ message }}</p>{% endif %}
        <label>{{ t.t("alert.below") }}<input type="text" name="{{ f.target_price }}" value="{{ form.target_price }}" inputmode="decimal" required{{ form.errors.aria(f.target_price)|safe }}></label>
        {%- if let Some(message) = form.errors.get(f.target_price) %}<p class="field-error" id="{{ f.target_price }}-error">{{ message }}</p>{% endif %}
        <button type="submit">{{ t.t("alert.submit") }}</button>
      </form>
    </div>
