[package]
name = "item-page"
version = "0.1.0"
edition = "2024"
publish = false
description = "A marketplace item page on Corten with the production pieces on: CSP, versioned assets, PWA, i18n, compression, MCP tools."

[dependencies]
corten = { path = "../../crates/corten", features = ["json", "agent", "compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
schemars = "1.2"
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
