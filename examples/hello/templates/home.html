<h1>Watchlist</h1>
<live-prices data-src="/feed/cards">
<table class="cards">
<thead><tr><th>Card</th><th>Price</th></tr></thead>
<tbody>
{% for card in cards %}<tr><td>{{ card.name }}</td><td data-ref="price" data-id="{{ card.id }}">{{ card.price }}</td></tr>
{% endfor %}</tbody>
</table>
</live-prices>
<form method="post" action="/watch" data-patch>
<label>Card <select name="id">{% for card in cards %}<option value="{{ card.id }}">{{ card.name }}</option>{% endfor %}</select></label>
<button>Watch</button>
</form>
{% include "watch_message.html" %}
