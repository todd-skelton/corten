<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ head|safe }}
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site">
<nav><a href="/" data-nav{% if head.is_current("/", false) %} aria-current="page"{% endif %}>Watchlist</a>
<a href="/about" data-nav{% if head.is_current("/about", false) %} aria-current="page"{% endif %}>About</a></nav>
{% if let Some(viewer) = viewer %}<span class="viewer">Signed in as {{ viewer.name }}</span>{% else %}<form method="post" action="/sign-in" data-patch><button>Sign in as Ada</button></form>{% endif %}
</header>
<main>{{ main|safe }}</main>
</body>
</html>
