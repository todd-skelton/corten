[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false
description = "Every Corten piece on one screen: page, form patch, live island, navigation, and the same screen as JSON."

[dependencies]
corten = { path = "../../crates/corten", features = ["feed", "types"] }
askama = "0.16"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
