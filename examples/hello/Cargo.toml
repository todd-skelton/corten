[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false
description = "Every Corten piece on one screen: page, form patch, live prices from a handler, navigation, and the same screen as JSON."

[dependencies]
corten = { path = "../../crates/corten", features = ["feed", "types", "compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
schemars = "1.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
