[package]
name = "watchlist"
version = "0.1.0"
edition = "2024"
publish = false
description = "A stock watchlist on Corten: live prices, market news, price alerts and an account. The browser smoke tests run against it."

[dependencies]
corten = { path = "../../crates/corten", features = ["feed", "types", "compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2"
# The frames of the WebSocket at /quotes; Corten hands over the connection.
tokio-tungstenite = { version = "0.30", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
