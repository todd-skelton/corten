[package]
name = "corten-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Corten's live-data wire protocol: snapshots, numbered patches, cursors and a client replica. No web or async dependencies, so it builds for servers, native apps (through UniFFI) and agents alike."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
