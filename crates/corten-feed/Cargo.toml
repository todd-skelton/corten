[package]
name = "corten-feed"
version = "0.1.0"
edition = "2021"
publish = false
description = "The server side of a Corten live feed: keyed rows, numbered patches, replay and resume, served as JSON snapshots and server-sent events on axum."

[dependencies]
corten-protocol = { path = "../corten-protocol" }
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
http-body-util = "0.1"
