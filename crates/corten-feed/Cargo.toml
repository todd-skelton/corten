[package]
name = "corten-feed"
version.workspace = true
edition = "2021"
description = "The server side of a Corten live feed: keyed rows, numbered patches, replay and resume, served as JSON snapshots and server-sent events on axum."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["corten", "sse", "live", "feed", "axum"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
corten-protocol.workspace = true
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
http-body-util = "0.1"
