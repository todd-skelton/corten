[package]
name = "corten-cluster"
version.workspace = true
edition = "2021"
description = "One Corten feed served by many instances: Postgres outbox, a leased relay to NATS JetStream, and per-instance followers that resume each other's cursors."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["corten", "nats", "postgres", "outbox", "feed"]
categories = ["web-programming::http-server", "database"]

[dependencies]
corten = { workspace = true, features = ["feed"] }
async-nats = "0.50"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
