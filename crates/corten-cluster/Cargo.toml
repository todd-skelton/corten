[package]
name = "corten-cluster"
version = "0.1.0"
edition = "2021"
publish = false
description = "One Corten feed served by many instances: Postgres outbox, a leased relay to NATS JetStream, and per-instance followers that resume each other's cursors."

[dependencies]
corten-feed = { path = "../corten-feed" }
axum = "0.8"
async-nats = "0.50"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
